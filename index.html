<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>TEN STATISTIC - Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }

        /* กล่องใหญ่พื้นหลังสำหรับแคปรูป */
        .capture-wrapper {
            background-color: #e5e7eb;
            padding: 30px;
            border-radius: 8px;
            width: 1200px; /* ขยายให้กว้างพอสำหรับ 4 คอลัมน์ */
        }

        /* หัวกระดาษ */
        .page-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .page-header h1 {
            margin: 0; font-size: 36px; text-transform: uppercase;
            letter-spacing: 2px;
        }
        .page-header p { margin: 5px 0 0 0; font-size: 16px; color: #555; }

        /* การจัด Layout หลักแบบ Grid เหมือนใน Canva */
        .grid-container {
            display: grid;
            grid-template-columns: 280px 280px 320px 280px; /* 4 คอลัมน์ */
            gap: 15px;
            align-items: start;
        }

        /* กลุ่มคอลัมน์ซ้ายสุด (Social + YouTube Base) */
        .col-left { display: flex; flex-direction: column; gap: 15px; }
        
        /* กลุ่มคอลัมน์ขวาสุด (Spotify Listeners + Spotify Base) */
        .col-right { display: flex; flex-direction: column; gap: 15px; }

        /* ดีไซน์กล่องสถิติ (สีดำ) */
        .stat-box {
            background-color: #1a1a24;
            color: #ffffff;
            padding: 20px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }
        
        /* สไตล์ของแต่ละหัวข้อกล่อง */
        .header { font-size: 16px; font-weight: bold; letter-spacing: 1px; padding-bottom: 8px; margin-bottom: 15px; text-transform: uppercase; }
        .h-purple { color: #c084fc; border-bottom: 3px solid #c084fc; } /* Social Followers */
        .h-red { color: #ef4444; border-bottom: 3px solid #ef4444; }    /* Youtube */
        .h-orange { color: #f97316; border-bottom: 3px solid #f97316; } /* Spotify */

        .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; align-items: center;}
        .platform-name { color: #d1d5db; width: 45%; }
        .value-col { text-align: right; width: 25%; font-weight: bold;}
        .diff-col { text-align: right; width: 30%; font-size: 11px;}
        
        .up { color: #10b981; font-weight: bold; }
        .down { color: #ef4444; font-weight: bold; }

        .btn-download { margin-top: 20px; background-color: #a855f7; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        #loading { font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="loading">กำลังดึงข้อมูลจากชีท For post...</div>

    <div class="capture-wrapper" id="capture-area" style="display: none;">
        <div class="page-header">
            <h1 id="main-title">TEN <span style="font-weight: 300;">STATISTIC</span></h1>
            <p id="sub-title">TEN LEE TEAM</p>
        </div>

        <div class="grid-container">
            <!-- คอลัมน์ 1: Social & YouTube Base -->
            <div class="col-left">
                <div class="stat-box">
                    <div class="header h-purple">SOCIAL FOLLOWERS</div>
                    <div id="box-social"></div>
                </div>
                <div class="stat-box">
                    <div class="header h-red">YOUTUBE BASE</div>
                    <div id="box-yt-base"></div>
                </div>
            </div>

            <!-- คอลัมน์ 2: YouTube Views -->
            <div class="stat-box">
                <div class="header h-red">YOUTUBE VIEWS</div>
                <div id="box-yt-views"></div>
            </div>

            <!-- คอลัมน์ 3: Spotify Streams -->
            <div class="stat-box" style="width: 100%;">
                <div class="header h-orange">SPOTIFY STREAMS (TOP 10)</div>
                <div id="box-spotify-streams"></div>
            </div>

            <!-- คอลัมน์ 4: Spotify Listeners & Spotify Base -->
            <div class="col-right">
                <div class="stat-box">
                    <div class="header h-orange">SPOTIFY LISTENERS (TOP 5)</div>
                    <div id="box-spotify-list"></div>
                </div>
                <div class="stat-box">
                    <div class="header h-orange">SPOTIFY BASE</div>
                    <div id="box-spotify-base"></div>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-download" onclick="saveAsImage()" style="display: none;" id="btn-save">📸 ดาวน์โหลดรูปภาพ</button>

    <script>
        function formatDiff(diffValue) {
            if (!diffValue) return '';
            const strValue = String(diffValue).trim();
            if (strValue.includes('▲')) return `<span class="up">${strValue}</span>`;
            if (strValue.includes('▼')) return `<span class="down">${strValue}</span>`;
            return `<span>${strValue}</span>`;
        }

        function formatNumber(numStr) {
            const num = parseInt(numStr.replace(/,/g, ''));
            return isNaN(num) ? numStr : num.toLocaleString();
        }

        function createRow(name, val, diff) {
            return `
                <div class="row">
                    <span class="platform-name">${name}</span>
                    <span class="value-col">${formatNumber(val)}</span>
                    <span class="diff-col">${formatDiff(diff)}</span>
                </div>
            `;
        }

        function loadData() {
            // *** นำลิงก์ CSV ของหน้า "For post" มาวางด้านล่างนี้ ***
            const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS13SniBy8Q6Z-FJlhMVqqQZrTdsC2u_IKaR_4P8kCyJHaDk56_5dsG6jGR3yUOesFAn-L1j8ab2zP/pub?gid=60150505&single=true&output=csv';

            Papa.parse(sheetUrl, {
                download: true,
                header: false,
                complete: function(results) {
                    const data = results.data;
                    
                    let htmlSocial = '';
                    let htmlYtBase = '';
                    let htmlYtViews = '';
                    let htmlSpoStreams = '';
                    let htmlSpoList = '';
                    let htmlSpoBase = '';

                    let currentCategory = '';

                    data.forEach((row, index) => {
                        // ดึงวันที่จากบรรทัดที่ 1 (อิงจากชีท For post)
                        if (index === 0 && row[1]) {
                            document.getElementById('sub-title').innerText = "TEN LEE TEAM • " + row[1].replace('TEN STATISTIC : ', '').trim();
                            return;
                        }

                        // ข้อมูลชีท For post เริ่มที่คอลัมน์ B (index 1)
                        const colName = row[1] ? String(row[1]).trim() : ''; 
                        const colVal = row[2] ? String(row[2]).trim() : ''; 
                        const colDiff = row[3] ? String(row[3]).trim() : ''; 

                        if (!colName) return;

                        // ตรวจจับชื่อหมวดหมู่
                        if (colName === '𝗙𝗼𝗹𝗹𝗼𝘄𝗲𝗿𝘀') { currentCategory = 'social'; return; }
                        if (colName === 'YouTube (@tenoffcl):') { currentCategory = 'yt_base'; return; }
                        if (colName === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆') { currentCategory = 'spo_base'; return; }
                        if (colName === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆 𝗹𝗶𝘀𝘁𝗲𝗻𝗲𝗿𝘀 (𝗧𝗼𝗽 𝟱)') { currentCategory = 'spo_list'; return; }
                        if (colName === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆 𝘀𝘁𝗿𝗲𝗮𝗺𝘀 (𝗧𝗼𝗽 𝟭𝟬)') { currentCategory = 'spo_streams'; return; }
                        if (colName === 'Youtube views') { currentCategory = 'yt_views'; return; }

                        // ถ้ายอดรวมไม่มีข้อมูล ข้ามไป
                        if (!colVal || colVal === '') return;

                        // สร้าง HTML แต่ละบรรทัดและแยกใส่กล่อง
                        const rowHtml = createRow(colName, colVal, colDiff);

                        if (currentCategory === 'social') htmlSocial += rowHtml;
                        if (currentCategory === 'yt_base') htmlYtBase += rowHtml;
                        if (currentCategory === 'spo_base') htmlSpoBase += rowHtml;
                        if (currentCategory === 'spo_list') htmlSpoList += rowHtml;
                        if (currentCategory === 'spo_streams') htmlSpoStreams += rowHtml;
                        if (currentCategory === 'yt_views') htmlYtViews += rowHtml;
                    });

                    // ยัดโค้ดลงในกล่องหน้าเว็บ
                    document.getElementById('box-social').innerHTML = htmlSocial;
                    document.getElementById('box-yt-base').innerHTML = htmlYtBase;
                    document.getElementById('box-spo-base').innerHTML = htmlSpoBase;
                    document.getElementById('box-spotify-list').innerHTML = htmlSpoList;
                    document.getElementById('box-spotify-streams').innerHTML = htmlSpoStreams;
                    document.getElementById('box-yt-views').innerHTML = htmlYtViews;
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('capture-area').style.display = 'block';
                    document.getElementById('btn-save').style.display = 'block';
                }
            });
        }

        function saveAsImage() {
            const box = document.getElementById('capture-area');
            html2canvas(box, { scale: 2, backgroundColor: '#f0f0f0' }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'ten-all-stats.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
