<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>TEN STATS - Generator</title>
    <!-- โหลดไลบรารีที่จำเป็น -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        body {
            background-color: #e5e7eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; padding: 50px;
        }
        
        /* จัดกล่องให้อยู่ข้างกัน */
        .card-container {
            display: flex;
            gap: 20px;
            background-color: #e5e7eb;
            padding: 20px;
        }

        /* ดีไซน์กล่องสถิติ (สีดำแบบใน Canva) */
        .stat-box {
            background-color: #1e1e24; color: #ffffff;
            width: 350px; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        /* สีและเส้นใต้ของหัวข้อ */
        .header-pink { color: #a855f7; border-bottom: 3px solid #a855f7; }
        .header-orange { color: #f97316; border-bottom: 3px solid #f97316; }

        .header {
            font-size: 18px; font-weight: bold; letter-spacing: 1px;
            padding-bottom: 8px; margin-bottom: 20px; text-transform: uppercase;
        }

        /* การจัดเรียงตัวเลขแต่ละบรรทัด */
        .row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
        .platform-name { color: #d1d5db; }
        
        /* สีตัวอักษรลูกศร เขียว/แดง */
        .up { color: #10b981; font-weight: bold; font-size: 12px; }
        .down { color: #ef4444; font-weight: bold; font-size: 12px; }
        
        /* ปุ่มดาวน์โหลด */
        .btn-download {
            margin-top: 30px; background-color: #a855f7; color: white; border: none;
            padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold;
        }
        .btn-download:hover { background-color: #9333ea; }
        #loading { color: #333; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loading">กำลังดึงข้อมูลจาก Google Sheets (หน้า Main)...</div>

    <!-- พื้นที่สำหรับแคปรูป จะครอบคลุมทั้ง 2 กล่อง -->
    <div id="capture-area" class="card-container" style="display: none;">
        
        <!-- กล่องที่ 1: Social Followers -->
        <div class="stat-box">
            <div class="header header-pink">SOCIAL FOLLOWERS</div>
            <div id="followers-container"></div>
        </div>

        <!-- กล่องที่ 2: Spotify Streams -->
        <div class="stat-box">
            <div class="header header-orange">SPOTIFY STREAMS (TOP 10)</div>
            <div id="spotify-container"></div>
        </div>

    </div>

    <button class="btn-download" onclick="saveAsImage()" style="display: none;" id="btn-save">📸 ดาวน์โหลดรูปภาพ</button>

    <script>
        // ฟังก์ชันจัดการลูกศรและสี (รองรับทั้งสูตรของเพื่อน และเลขดิบๆ)
        function formatDiff(diffValue) {
            if (!diffValue) return '';
            const strValue = String(diffValue).trim();
            
            // ถ้าเจอสัญลักษณ์ลูกศรที่เพื่อนเขียนสูตรไว้ ให้ใส่สีเลย
            if (strValue.includes('▲')) return `<span class="up">${strValue}</span>`;
            if (strValue.includes('▼')) return `<span class="down">${strValue}</span>`;
            
            // ถ้าเป็นตัวเลขดิบๆ ไม่มีลูกศร ให้โค้ดคำนวณและใส่ลูกศรให้เอง
            const num = parseInt(strValue.replace(/,/g, ''));
            if (!isNaN(num) && num !== 0) {
                if (num > 0) return `<span class="up">▲ (+${num.toLocaleString()})</span>`;
                if (num < 0) return `<span class="down">▼ (${num.toLocaleString()})</span>`;
            }
            return `<span>${strValue}</span>`;
        }

        // ฟังก์ชันโหลดข้อมูล
        function loadData() {
            // *** เอาลิงก์ CSV ของหน้า Main มาวางในเครื่องหมาย ' ' ด้านล่างนี้ ***
            const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS13SniBy8Q6Z-FJlhMVqqQZrTdsC2u_IKaR_4P8kCyJHaDk56_5dsG6jGR3yUOesFAn-L1j8ab2zP/pub?gid=1826113344&single=true&output=csv';

            Papa.parse(sheetUrl, {
                download: true,
                header: false,
                complete: function(results) {
                    const data = results.data;
                    let htmlFollowers = '';
                    let htmlSpotify = '';
                    let currentSection = 'other'; // เริ่มต้นให้ข้ามไปก่อน จนกว่าจะเจอหมวดที่ต้องการ

                    data.forEach((row, index) => {
                        // ข้ามบรรทัดแรกที่เป็นหัวตารางวันที่
                        if (index === 0) return;

                        const colA = row[0] ? String(row[0]).trim() : ''; // ชื่อแพลตฟอร์ม/เพลง
                        const colB = row[1] ? String(row[1]).trim() : ''; // ยอดรวม
                        const colC = row[2] ? String(row[2]).trim() : ''; // ผลต่าง

                        if (!colA) return; // ข้ามบรรทัดที่คอลัมน์ A ว่าง

                        // เช็คหัวข้อหมวดหมู่
                        // สมมติว่าเมื่อเจอบรรทัดที่มีคำเหล่านี้ (และคอลัมน์ B ว่าง) คือการเริ่มหมวดหมู่ใหม่
                        if (!colB || colB === '' || colB === 'NaN') {
                            if (colA.includes('Followers') || colA.includes('𝗙𝗼𝗹𝗹𝗼𝘄𝗲𝗿𝘀')) {
                                currentSection = 'followers';
                            } else if (colA.includes('Spotify streams') || colA.includes('𝗦𝗽𝗼𝘁𝗶𝗳𝘆 𝘀𝘁𝗿𝗲𝗮𝗺𝘀 (𝗧𝗼𝗽 𝟭𝟬)')) {
                                currentSection = 'spotify_streams';
                            } else {
                                // ถ้าเป็นหัวข้ออื่นๆ (เช่น YouTube, Spotify Listeners (Top 5)) ให้หยุดดึงข้อมูลชั่วคราว
                                currentSection = 'other'; 
                            }
                            return; // ข้ามบรรทัดที่เป็นหัวข้อ
                        }

                        // ถ้ายอดรวมมีข้อมูล และอยู่ในหมวด Followers หรือ Spotify Streams
                        if ((currentSection === 'followers' || currentSection === 'spotify_streams') && colB && colB !== 'NaN') {
                            const title = colA;
                            let total = colB;
                            
                            // จัดฟอร์แมตยอดรวมให้มีลูกน้ำสวยๆ
                            const parsedB = parseInt(colB.replace(/,/g, ''));
                            if (!isNaN(parsedB)) total = parsedB.toLocaleString();
                            
                            // ดึงผลต่างมาใส่สี
                            const diff = formatDiff(colC);

                            const rowHtml = `
                                <div class="row">
                                    <span class="platform-name">${title}</span>
                                    <span>${total} ${diff}</span>
                                </div>
                            `;

                            // แยกใส่กล่องซ้ายขวาตามหมวดหมู่
                            if (currentSection === 'followers') htmlFollowers += rowHtml;
                            if (currentSection === 'spotify_streams') htmlSpotify += rowHtml;
                        }
                    });

                    // นำข้อมูลยัดลงกล่อง
                    document.getElementById('followers-container').innerHTML = htmlFollowers;
                    document.getElementById('spotify-container').innerHTML = htmlSpotify;
                    
                    // แสดงผล
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('capture-area').style.display = 'flex';
                    document.getElementById('btn-save').style.display = 'block';
                }
            });
        }

        // ฟังก์ชันเซฟรูปภาพ
        function saveAsImage() {
            const box = document.getElementById('capture-area');
            html2canvas(box, { scale: 3, backgroundColor: '#e5e7eb' }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'ten-stat-update.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
