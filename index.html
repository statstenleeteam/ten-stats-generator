<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>TEN STATISTIC - Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f0f0f0;
            font-family: 'Montserrat', 'Noto Sans Thai', sans-serif;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
            margin: 0;
        }

        .tab-container { display: flex; gap: 15px; margin-bottom: 20px; }
        .tab-btn { background-color: #d1d5db; color: #374151; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .tab-btn:hover { background-color: #9ca3af; }
        .tab-btn.active { background-color: #a855f7; color: white; box-shadow: 0 4px 10px rgba(168, 85, 247, 0.4); }

        .tab-section { display: none; margin: 0 auto; }
        .tab-section.active { display: block; }

        /* --- กรอบของแผ่น Spotify / YT Music --- */
        .page-slice {
            background-color: #f3effc;
            padding: 40px;
            border-radius: 12px;
            margin: 0 auto 25px auto;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            width: 800px; 
            min-height: 200px;
        }

        /* --- หน้า Overall --- */
        #overall-page {
            width: 1350px; 
            height: 1012px; 
            background-color: #e5e7eb; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
        }
        
        .overall-content-wrapper { width: 100%; max-width: 1270px; }

        .overall-header { text-align: center; margin-bottom: 40px; position: relative; }
        .overall-header h1 { margin: 0; font-size: 68px; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; color: #111827; }
        .overall-header h1 span { color: #9333ea; font-style: italic; padding-right: 8px; }
        .overall-header p { margin: 12px 0 0 0; font-size: 18px; color: #4b5563; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
        .overall-header::after { content: ''; display: block; width: 100px; height: 4px; background: linear-gradient(90deg, #a855f7, #f97316); margin: 25px auto 0; border-radius: 2px; }

        /* ปรับขนาดคอลัมน์ให้รวมกันพอดีเป๊ะกับความกว้างหน้าจอ */
        .grid-container { display: flex; gap: 20px; justify-content: center; align-items: start; width: 100%; }
        .col-layout { display: flex; flex-direction: column; gap: 22px; }
        .col-layout:nth-child(1) { width: 295px; }
        .col-layout:nth-child(2) { width: 310px; }
        .col-layout:nth-child(3) { width: 310px; }
        .col-layout:nth-child(4) { width: 295px; }
        
        .stat-box-overall { 
            background-color: #1c1c24; color: #ffffff; 
            padding: 24px 18px; /* ลด padding ซ้ายขวา เพื่อเพิ่มพื้นที่ตรงกลาง */
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            box-sizing: border-box; display: block; width: 100%;
        }
        
        .header { 
            font-size: 15px; font-weight: 700; letter-spacing: 1px; 
            padding-bottom: 12px; margin-bottom: 20px; text-transform: uppercase; 
            width: 100%; display: block;
        }
        .h-purple { color: #a855f7; border-bottom: 3px solid #a855f7; }
        .h-red { color: #ef4444; border-bottom: 3px solid #ef4444; }    
        .h-orange { color: #f97316; border-bottom: 3px solid #f97316; } 

        /* โครงสร้างอมตะ! ล็อกความกว้างตัวเลข ห้ามเบี้ยว ห้ามล้น */
        .row-overall { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 14px; 
            font-size: 13.5px; 
            width: 100%; 
        }
        div[id^="box-"] .row-overall:last-child { margin-bottom: 0; } 

        .platform-name { 
            color: #d1d5db; line-height: 1.3; font-weight: 500; 
            text-align: left; flex: 1; padding-right: 5px; 
            word-wrap: break-word; /* ยอมให้ตกบรรทัดได้ถ้าชื่อยาว */
        }
        .value-col { 
            text-align: right; font-weight: 600; color: #fff; 
            width: 82px; /* ล็อกความกว้างช่องตัวเลข */
            flex-shrink: 0; white-space: nowrap; 
        }
        .diff-col { 
            text-align: right; font-size: 11.5px; font-weight: 600; 
            width: 80px; /* ล็อกความกว้างช่องลูกศร */
            flex-shrink: 0; line-height: 1.2; 
        }

        /* --- กล่อง Total ด้านบน --- */
        .total-box-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .total-box { background-color: #1f2029; color: white; padding: 20px; border-radius: 12px; text-align: center; width: 320px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .total-box h3 { margin: 0; font-size: 14px; font-weight: 600; color: #d1d5db; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase;}
        .total-box .val { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: 1px;}
        .total-box .diff { margin-top: 8px; font-size: 14px; font-weight: 700; }

        /* --- ตารางแบบ Canva --- */
        .canva-table-container { background-color: transparent; width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .canva-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
        .canva-table td { padding: 11px 15px; color: #4c3c6d; font-weight: 700; }
        
        .canva-table tr.data-row:nth-child(even) { background-color: #ffffff; }
        .canva-table tr.data-row:nth-child(odd) { background-color: #ece5fa; }

        .canva-table tr.section-title { background-color: #1f2029; color: #ffffff; }
        .canva-table tr.section-title td { color: #ffffff; font-weight: 700; font-size: 13px; padding: 12px 15px; text-transform: uppercase; letter-spacing: 1px; }

        .song-name { text-align: left; width: 40%; padding-left: 25px !important; }
        .song-value { text-align: center; width: 30%; }
        .song-diff { text-align: right; width: 30%; padding-right: 25px !important; }

        .up { color: #10b981; }
        .down { color: #ef4444; }
        .equal { color: #8b5cf6; } 

        .btn-download { margin-top: 10px; background-color: #a855f7; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(168, 85, 247, 0.3); transition: 0.2s; }
        .btn-download:hover { background-color: #9333ea; transform: translateY(-2px); }
        #loading { font-weight: bold; margin-bottom: 20px; font-size: 18px; color: #333; }
    </style>
</head>
<body>

    <div class="tab-container" id="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-overall')">📊 OVERALL</button>
        <button class="tab-btn" onclick="switchTab('tab-spo')">🎧 SPOTIFY</button>
        <button class="tab-btn" onclick="switchTab('tab-ytms')">🎵 YT MUSIC</button>
    </div>

    <div id="loading">⏳ กำลังประมวลผลข้อมูล และจัดหน้ากระดาษ...</div>

    <!-- แท็บ 1: OVERALL -->
    <div class="tab-section active" id="tab-overall">
        <div class="page-slice" id="overall-page">
            <div class="overall-content-wrapper">
                <div class="overall-header">
                    <h1 id="main-title"><span>TEN</span>STATISTIC</h1>
                    <p id="sub-title-overall">TEN LEE TEAM</p>
                </div>
                
                <div class="grid-container">
                    <div class="col-layout">
                        <div class="stat-box-overall"><div class="header h-purple">SOCIAL FOLLOWERS</div><div id="box-social"></div></div>
                        <div class="stat-box-overall"><div class="header h-red">YOUTUBE BASE</div><div id="box-yt-base"></div></div>
                    </div>
                    
                    <div class="col-layout">
                        <div class="stat-box-overall"><div class="header h-red">YOUTUBE VIEWS</div><div id="box-yt-views"></div></div>
                    </div>
                    
                    <div class="col-layout">
                        <div class="stat-box-overall"><div class="header h-orange">SPOTIFY STREAMS <br>(TOP 10)</div><div id="box-spotify-streams"></div></div>
                    </div>

                    <div class="col-layout">
                        <div class="stat-box-overall"><div class="header h-orange">SPOTIFY LISTENERS <br>(TOP 5)</div><div id="box-spotify-list"></div></div>
                        <div class="stat-box-overall"><div class="header h-orange">SPOTIFY BASE</div><div id="box-spotify-base"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- แท็บ 2: SPOTIFY -->
    <div class="tab-section" id="tab-spo">
        <div id="content-spo"></div>
    </div>

    <!-- แท็บ 3: YT MUSIC -->
    <div class="tab-section" id="tab-ytms">
        <div id="content-ytms"></div>
    </div>

    <button class="btn-download" onclick="saveAsImage()" style="display: none;" id="btn-save">📸 ดาวน์โหลดรูปภาพทั้งหมดในหน้านี้</button>

    <script>
        const CSV_OVERALL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS13SniBy8Q6Z-FJlhMVqqQZrTdsC2u_IKaR_4P8kCyJHaDk56_5dsG6jGR3yUOesFAn-L1j8ab2zP/pub?gid=60150505&single=true&output=csv';
        const CSV_SPO = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS13SniBy8Q6Z-FJlhMVqqQZrTdsC2u_IKaR_4P8kCyJHaDk56_5dsG6jGR3yUOesFAn-L1j8ab2zP/pub?gid=907365518&single=true&output=csv'; 
        const CSV_YTMS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS13SniBy8Q6Z-FJlhMVqqQZrTdsC2u_IKaR_4P8kCyJHaDk56_5dsG6jGR3yUOesFAn-L1j8ab2zP/pub?gid=1171176371&single=true&output=csv'; 

        let currentActiveTab = 'tab-overall';

        function switchTab(tabId) {
            document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            currentActiveTab = tabId;
        }

        function formatDiff(diffValue) {
            if (!diffValue) return '';
            let strValue = String(diffValue).trim();
            strValue = strValue.replace(/▲\s*▲/g, '▲');
            strValue = strValue.replace(/▼\s*▼/g, '▼');
            strValue = strValue.replace(/([+-]\s?)(\d{4,})/g, function(match, p1, p2) {
                return p1 + parseInt(p2).toLocaleString();
            });
            if (strValue.includes('=')) return `<span class="equal">${strValue}</span>`;
            if (strValue.includes('▲')) return `<span class="up">${strValue}</span>`;
            if (strValue.includes('▼')) return `<span class="down">${strValue}</span>`;
            return `<span>${strValue}</span>`;
        }

        function formatNumber(numStr) {
            if(!numStr) return '';
            const num = parseFloat(numStr.replace(/,/g, ''));
            if (isNaN(num)) return numStr;
            if (numStr.includes('M') || numStr.includes('K')) return numStr;
            return num.toLocaleString();
        }

        async function fetchCSV(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) return null;
                const text = await response.text();
                return Papa.parse(text).data;
            } catch (err) {
                return null;
            }
        }

        function processOverall(data) {
            let htmlSocial = '', htmlYtBase = '', htmlYtViews = '';
            let htmlSpoStreams = '', htmlSpoList = '', htmlSpoBase = '';
            let currentCategory = '';

            data.forEach(row => {
                if (!row) return;
                const colB = row[1] ? String(row[1]).trim() : ''; 
                const colC = row[2] ? String(row[2]).trim() : ''; 
                const colD = row[3] ? String(row[3]).trim() : ''; 

                if (colB.includes('TEN STATISTIC')) {
                    document.getElementById('sub-title-overall').innerText = "TEN LEE TEAM • " + colB.replace('TEN STATISTIC :', '').trim();
                    return;
                }
                if (!colB) return;
                
                if (colB === '𝗙𝗼𝗹𝗹𝗼𝘄𝗲𝗿𝘀') { currentCategory = 'social'; return; }
                if (colB === 'YouTube (@tenoffcl):' || colB === 'YouTube (@tenoffcl)') { currentCategory = 'yt_base'; return; }
                if (colB === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆') { currentCategory = 'spo_base'; return; }
                if (colB === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆 𝗹𝗶𝘀𝘁𝗲𝗻𝗲𝗿𝘀 (𝗧𝗼𝗽 𝟱)') { currentCategory = 'spo_list'; return; }
                if (colB === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆 𝘀𝘁𝗿𝗲𝗮𝗺𝘀 (𝗧𝗼𝗽 𝟭𝟬)') { currentCategory = 'spo_streams'; return; }
                if (colB === 'Youtube views' || colB === '𝗬𝗼𝘂𝘁𝘂𝗯𝗲 𝗩𝗶𝗲𝘄𝘀') { currentCategory = 'yt_views'; return; }
                if (!colC) return;

                let cleanDiff = formatDiff(colD);
                if(cleanDiff.includes('for 7 days')) cleanDiff = cleanDiff.replace('for 7 days', '<br>for 7 days');
                
                // ใช้ HTML div คู่กับ Flexbox ตัวใหม่ รับรองไม่มีวันเบี้ยว
                const rowHtml = `<div class="row-overall">
                    <div class="platform-name">${colB}</div>
                    <div class="value-col">${formatNumber(colC)}</div>
                    <div class="diff-col">${cleanDiff}</div>
                </div>`;

                if (currentCategory === 'social') htmlSocial += rowHtml;
                if (currentCategory === 'yt_base') htmlYtBase += rowHtml;
                if (currentCategory === 'spo_base') htmlSpoBase += rowHtml;
                if (currentCategory === 'spo_list') htmlSpoList += rowHtml;
                if (currentCategory === 'spo_streams') htmlSpoStreams += rowHtml;
                if (currentCategory === 'yt_views') htmlYtViews += rowHtml;
            });

            document.getElementById('box-social').innerHTML = htmlSocial;
            document.getElementById('box-yt-base').innerHTML = htmlYtBase;
            document.getElementById('box-spotify-base').innerHTML = htmlSpoBase; 
            document.getElementById('box-spotify-list').innerHTML = htmlSpoList;
            document.getElementById('box-spotify-streams').innerHTML = htmlSpoStreams;
            document.getElementById('box-yt-views').innerHTML = htmlYtViews;
        }

        function reorderSingleSongs(data) {
            let birthdayIndex = -1;
            let songsToMove = [];
            let targetSongs = ["If You Don't Mean It", "No Pressure", "OUTWEST", "IRL"];
            let newData = [];

            for (let i = 0; i < data.length; i++) {
                if (!data[i]) continue;
                let colName = data[i][1] ? String(data[i][1]).trim() : '';
                
                let isTarget = false;
                for(let t of targetSongs) {
                    if(colName.toLowerCase() === t.toLowerCase()) {
                        isTarget = true;
                        break;
                    }
                }

                if (isTarget) {
                    songsToMove.push(data[i]);
                } else {
                    newData.push(data[i]);
                }
            }

            for (let i = 0; i < newData.length; i++) {
                let colName = newData[i][1] ? String(newData[i][1]).trim() : '';
                if (colName.toLowerCase() === "birthday inst.") {
                    birthdayIndex = i;
                    break;
                }
            }

            if (birthdayIndex === -1) {
                for (let i = 0; i < newData.length; i++) {
                    let colName = newData[i][1] ? String(newData[i][1]).trim() : '';
                    if (colName.toLowerCase() === "birthday") { birthdayIndex = i; break; }
                }
            }

            if (birthdayIndex !== -1 && songsToMove.length > 0) {
                let orderedSongs = [];
                targetSongs.forEach(target => {
                    let found = songsToMove.find(s => s[1].trim().toLowerCase() === target.toLowerCase());
                    if(found) orderedSongs.push(found);
                });
                newData.splice(birthdayIndex + 1, 0, ...orderedSongs);
            }
            return newData.length > 0 ? newData : data;
        }

        function processCanvaTableSplitted(data, tabContentId, isSpo) {
            data = reorderSingleSongs(data);

            let blocks = [];
            let currentBlock = null;
            let totalAllHtml = '';
            let totalSoloHtml = '';
            let dateVal = '';
            
            let passedTotals = false;
            let addedTotalAlbumHeader = false;

            let highlightColor = isSpo ? '#B57EDC' : '#942222';

            data.forEach(row => {
                if (!row) return;
                let rawColA = row[0] ? String(row[0]).trim() : '';
                let colName = row[1] ? String(row[1]).trim() : '';
                let colVal = row[2] ? String(row[2]).trim() : '';
                let colDiff = row[3] ? String(row[3]).trim() : '';
                let rawTitle = rawColA + ' ' + colName;

                if (rawTitle.includes('Spotify Streams') || rawTitle.includes('YouTube Music Streams') || rawTitle.includes('For ytms') || rawTitle.includes('Weekly')) {
                    let dateParts = rawTitle.split(':');
                    dateVal = dateParts.length > 1 ? dateParts[1].trim() : rawTitle.split(' ').pop().trim();
                    if(dateVal.includes('Streams')) dateVal = ''; 
                    return;
                }

                if (colName === 'streams' || colVal === 'streams' || (!colName && !colVal)) return;
                if (colName.toUpperCase() === 'TOTAL ALBUM:' || colName.toUpperCase() === 'TOTAL ALBUM') return;

                if (colName.toUpperCase().includes('TOTAL (ALL)')) {
                    totalAllHtml = `<div class="total-box"><h3>TOTAL STREAMS (ALL)</h3><div class="val">${formatNumber(colVal)}</div><div class="diff">${formatDiff(colDiff)}</div></div>`;
                    passedTotals = true;
                    return;
                }
                if (colName.toUpperCase().includes('TOTAL (SOLO)')) {
                    totalSoloHtml = `<div class="total-box"><h3>TOTAL STREAMS (SOLO)</h3><div class="val">${formatNumber(colVal)}</div><div class="diff">${formatDiff(colDiff)}</div></div>`;
                    passedTotals = true;
                    return;
                }

                let upperCol = colName.toUpperCase().trim();
                let isAlbumTotal = upperCol.includes('ALBUM TEN') || upperCol.includes('ALBUM STUNNER') || upperCol.includes('ALBUM HUMANITY') || 
                                   (passedTotals && (upperCol === 'TEN' || upperCol === 'STUNNER' || upperCol === 'HUMANITY' || upperCol === 'HUMANITY EP'));

                if (isAlbumTotal) {
                    if (!addedTotalAlbumHeader) {
                        let htmlRow = `<tr class="section-title">
                            <td class="song-name">TOTAL ALBUM</td>
                            <td class="song-value" style="color: #ef4444; font-size: 11px;">STREAMS</td>
                            <td class="song-diff" style="font-size: 11px;"><span class="up">▲</span><span class="down">▼</span></td>
                        </tr>`;
                        currentBlock = { type: 'album', rows: [htmlRow], height: 50 };
                        blocks.push(currentBlock);
                        addedTotalAlbumHeader = true;
                    }

                    let cleanName = colName.replace(/Album /i, '').replace(':', '').trim();
                    let htmlRow = `<tr class="data-row">
                        <td class="song-name" style="font-weight: 800; text-transform: uppercase; color: ${highlightColor};">${cleanName}</td>
                        <td class="song-value" style="font-weight: 800; color: ${highlightColor};">${formatNumber(colVal)}</td>
                        <td class="song-diff">${formatDiff(colDiff)}</td>
                    </tr>`;
                    currentBlock.rows.push(htmlRow);
                    currentBlock.height += 46; 
                    return;
                }

                if (colName && !colVal && !colDiff) {
                    let cleanAlbumName = colName.replace(/Album /i, '').replace(':', '').trim();
                    if(cleanAlbumName.includes('TEN LEE TEAM') || cleanAlbumName.toUpperCase() === 'SOLO') {
                        cleanAlbumName = 'TEN - SINGLE';
                    } else if (rawColA) {
                        cleanAlbumName = rawColA + ' ' + cleanAlbumName;
                    }
                    
                    let htmlRow = `<tr class="section-title">
                        <td class="song-name">${cleanAlbumName}</td>
                        <td class="song-value" style="color: #ef4444; font-size: 11px;">STREAMS</td>
                        <td class="song-diff" style="font-size: 11px;"><span class="up">▲</span><span class="down">▼</span></td>
                    </tr>`;
                    currentBlock = { type: 'album', rows: [htmlRow], height: 50 };
                    blocks.push(currentBlock);
                    return;
                }

                if (colName && colVal) {
                    let htmlRow = `<tr class="data-row">
                        <td class="song-name">${colName}</td>
                        <td class="song-value">${formatNumber(colVal)}</td>
                        <td class="song-diff">${formatDiff(colDiff)}</td>
                    </tr>`;
                    if (!currentBlock) { currentBlock = { type: 'album', rows: [], height: 0 }; blocks.push(currentBlock); }
                    currentBlock.rows.push(htmlRow);
                    currentBlock.height += 41; 
                }
            });

            let pages = [];
            let currentPage = { blocks: [], height: 160 }; 
            
            let totalsHtml = '';
            if(totalAllHtml || totalSoloHtml) {
                totalsHtml = `<div class="total-box-container">${totalAllHtml}${totalSoloHtml}</div>`;
                currentPage.height += 150; 
            }
            currentPage.hasTotals = true; 

            blocks.forEach(block => {
                if (currentPage.height + block.height > 960 && currentPage.blocks.length > 0) {
                    pages.push(currentPage);
                    currentPage = { blocks: [block], height: 160 + block.height, hasTotals: false };
                } else {
                    currentPage.blocks.push(block);
                    currentPage.height += block.height;
                }
            });
            if (currentPage.blocks.length > 0) {
                pages.push(currentPage);
            }

            let finalHtml = '';
            pages.forEach((page, index) => {
                let headerHtml = '';
                
                if (isSpo) {
                    headerHtml = `
                    <div style="text-align: center; margin-bottom: 30px; position: relative;">
                        <h1 style="margin: 0; font-size: 64px; font-weight: 800; color: #B57EDC; text-transform: uppercase; letter-spacing: 2px;">
                            SPOTIFY STREAMS
                        </h1>
                        <p style="margin: 10px 0 0 0; font-size: 16px; color: #4b5563; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;">TEN LEE TEAM • ${dateVal || '9/10/26'}</p>
                    </div>`;
                } else {
                    headerHtml = `
                    <div style="text-align: center; margin-bottom: 30px; position: relative;">
                        <h1 style="margin: 0; font-size: 64px; font-weight: 800; color: #942222; letter-spacing: 2px;">
                            <span style="text-transform: none;">YouTube</span> MUSIC STREAMS
                        </h1>
                        <p style="margin: 10px 0 0 0; font-size: 16px; color: #4b5563; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;">TEN LEE TEAM • ${dateVal || '5/10/26'}</p>
                    </div>`;
                }

                let pageTotalsHtml = page.hasTotals ? totalsHtml : '';
                let tableRowsHtml = '';
                page.blocks.forEach(b => { tableRowsHtml += b.rows.join(''); });
                
                finalHtml += `
                <div class="page-slice" style="padding-bottom: ${pages.length > 1 ? '60px' : '40px'};">
                    ${headerHtml}
                    ${pageTotalsHtml}
                    <div class="canva-table-container">
                        <table class="canva-table">
                            ${tableRowsHtml}
                        </table>
                    </div>
                    ${pages.length > 1 ? `<div style="position: absolute; bottom: 20px; right: 40px; color: #9ca3af; font-size: 12px; font-weight: bold;">Page ${index + 1}/${pages.length}</div>` : ''}
                </div>`;
            });

            document.getElementById(tabContentId).innerHTML = finalHtml;
        }

        async function loadAllData() {
            try {
                const [dataOverall, dataSpo, dataYtms] = await Promise.all([
                    fetchCSV(CSV_OVERALL),
                    fetchCSV(CSV_SPO),
                    fetchCSV(CSV_YTMS)
                ]);

                if (dataOverall) processOverall(dataOverall);
                if (dataSpo) processCanvaTableSplitted(dataSpo, 'content-spo', true);
                if (dataYtms) processCanvaTableSplitted(dataYtms, 'content-ytms', false);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('btn-save').style.display = 'block';
            } catch (error) {
                console.error("Load all data error: ", error);
                document.getElementById('loading').innerText = '❌ เกิดข้อผิดพลาดในการโหลดข้อมูล (กรุณารีเฟรชหน้าเว็บใหม่)';
            }
        }

        window.onload = loadAllData;

        async function saveAsImage() {
            const btn = document.getElementById('btn-save');
            const oldText = btn.innerText;
            btn.innerText = '⏳ กำลังประมวลผลและแคปภาพ...';

            let targets = [];
            let prefixName = '';

            if (currentActiveTab === 'tab-overall') {
                targets = [document.getElementById('overall-page')];
                prefixName = 'Overall';
            } else if (currentActiveTab === 'tab-spo') {
                targets = Array.from(document.querySelectorAll('#content-spo .page-slice'));
                prefixName = 'Spotify';
            } else if (currentActiveTab === 'tab-ytms') {
                targets = Array.from(document.querySelectorAll('#content-ytms .page-slice'));
                prefixName = 'YTMusic';
            }

            for (let i = 0; i < targets.length; i++) {
                const canvas = await html2canvas(targets[i], {
                    scale: 2, 
                    backgroundColor: currentActiveTab === 'tab-overall' ? '#e5e7eb' : '#f3effc', 
                    useCORS: true
                });
                
                const link = document.createElement('a');
                let suffix = targets.length > 1 ? `_Part${i+1}` : '';
                link.download = `TEN_STAT_${prefixName}${suffix}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                await new Promise(resolve => setTimeout(resolve, 500));
            }

            btn.innerText = oldText;
        }
    </script>
</body>
</html>
