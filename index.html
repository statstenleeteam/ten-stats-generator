<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>TEN STATISTIC - Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f0f0f0;
            font-family: 'Montserrat', 'Noto Sans Thai', sans-serif;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }

        .capture-wrapper {
            background-color: #e5e7eb;
            padding: 40px;
            border-radius: 8px;
            width: 1350px; 
        }

        .page-header { text-align: center; margin-bottom: 40px; }
        
        /* ขยายขนาดโลโก้ให้ใหญ่ขึ้นตรงนี้ (เปลี่ยนจาก 65px เป็น 110px) */
        .page-header img {
            height: 110px; 
            margin: 0 auto 15px auto; 
            display: block;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
        
        .page-header p { 
            margin: 8px 0 0 0; font-size: 16px; color: #6b7280; 
            font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 310px 310px 360px 310px;
            gap: 20px;
            align-items: start;
        }

        .col-left, .col-right { display: flex; flex-direction: column; gap: 20px; }

        .stat-box {
            background-color: #1c1c24; 
            color: #ffffff;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }
        
        .header { 
            font-size: 15px; font-weight: 700; letter-spacing: 1px; 
            padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase;
            line-height: 1.4;
        }
        .h-purple { color: #a855f7; border-bottom: 2px solid #a855f7; }
        .h-red { color: #ef4444; border-bottom: 2px solid #ef4444; }    
        .h-orange { color: #f97316; border-bottom: 2px solid #f97316; } 

        .row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 14px; 
            font-size: 13.5px; 
        }
        
        .platform-name { 
            flex: 1; 
            color: #d1d5db; 
            line-height: 1.3; 
            font-weight: 500;
            padding-right: 10px;
        }
        .value-col { width: 85px; text-align: right; font-weight: 600; }
        .diff-col { width: 95px; text-align: right; font-size: 12px; font-weight: 600; }
        
        .up { color: #10b981; }
        .down { color: #ef4444; }
        .equal { color: #c084fc; } 

        .btn-download { 
            margin-top: 20px; background-color: #a855f7; color: white; border: none; 
            padding: 14px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; 
            box-shadow: 0 4px 6px rgba(168, 85, 247, 0.3);
        }
        .btn-download:hover { background-color: #9333ea; }
        #loading { font-weight: bold; margin-bottom: 20px; font-size: 18px; color: #333; }
        #error-msg { display: none; color: red; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loading">กำลังดึงข้อมูล...</div>
    <div id="error-msg"></div>

    <div class="capture-wrapper" id="capture-area" style="display: none;">
        <div class="page-header">
            <img src="statslogo.png" alt="TEN STATISTIC">
            <p id="sub-title">TEN LEE TEAM</p>
        </div>

        <div class="grid-container">
            <div class="col-left">
                <div class="stat-box">
                    <div class="header h-purple">SOCIAL FOLLOWERS</div>
                    <div id="box-social"></div>
                </div>
                <div class="stat-box">
                    <div class="header h-red">YOUTUBE BASE</div>
                    <div id="box-yt-base"></div>
                </div>
            </div>

            <div class="stat-box">
                <div class="header h-red">YOUTUBE VIEWS</div>
                <div id="box-yt-views"></div>
            </div>

            <div class="stat-box" style="width: 100%;">
                <div class="header h-orange">SPOTIFY STREAMS <br>(TOP 10)</div>
                <div id="box-spotify-streams"></div>
            </div>

            <div class="col-right">
                <div class="stat-box">
                    <div class="header h-orange">SPOTIFY LISTENERS <br>(TOP 5)</div>
                    <div id="box-spotify-list"></div>
                </div>
                <div class="stat-box">
                    <div class="header h-orange">SPOTIFY BASE</div>
                    <div id="box-spotify-base"></div>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-download" onclick="saveAsImage()" style="display: none;" id="btn-save">📸 ดาวน์โหลดรูปภาพ</button>

    <script>
        function formatDiff(diffValue) {
            if (!diffValue) return '';
            let strValue = String(diffValue).trim();
            strValue = strValue.replace(/▲\s*▲/g, '▲');
            strValue = strValue.replace(/▼\s*▼/g, '▼');
            strValue = strValue.replace(/([+-]\s?)(\d{4,})/g, function(match, p1, p2) {
                return p1 + parseInt(p2).toLocaleString();
            });
            
            if (strValue.includes('=')) return `<span class="equal">${strValue}</span>`;
            if (strValue.includes('▲')) return `<span class="up">${strValue}</span>`;
            if (strValue.includes('▼')) return `<span class="down">${strValue}</span>`;
            
            return `<span>${strValue}</span>`;
        }

        function formatNumber(numStr) {
            const num = parseFloat(numStr.replace(/,/g, ''));
            if (isNaN(num)) return numStr;
            if (numStr.includes('M') || numStr.includes('K')) return numStr;
            return num.toLocaleString();
        }

        function createRow(name, val, diff) {
            let cleanDiff = formatDiff(diff);
            if(cleanDiff.includes('for 7 days')) {
                 cleanDiff = cleanDiff.replace('for 7 days', '<br>for 7 days');
            }
            return `
                <div class="row">
                    <span class="platform-name">${name}</span>
                    <span class="value-col">${formatNumber(val)}</span>
                    <span class="diff-col">${cleanDiff}</span>
                </div>
            `;
        }

        function loadData() {
            const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS13SniBy8Q6Z-FJlhMVqqQZrTdsC2u_IKaR_4P8kCyJHaDk56_5dsG6jGR3yUOesFAn-L1j8ab2zP/pub?gid=60150505&single=true&output=csv';

            Papa.parse(sheetUrl, {
                download: true,
                header: false,
                complete: function(results) {
                    try {
                        const data = results.data;
                        let htmlSocial = '', htmlYtBase = '', htmlYtViews = '';
                        let htmlSpoStreams = '', htmlSpoList = '', htmlSpoBase = '';
                        let currentCategory = '';

                        data.forEach((row, index) => {
                            const colA = row[0] ? String(row[0]).trim() : ''; 
                            const colB = row[1] ? String(row[1]).trim() : ''; 
                            const colC = row[2] ? String(row[2]).trim() : ''; 
                            const colD = row[3] ? String(row[3]).trim() : ''; 

                            if (colB.includes('TEN STATISTIC')) {
                                const dateStr = colB.replace('TEN STATISTIC :', '').trim();
                                document.getElementById('sub-title').innerText = "TEN LEE TEAM • " + dateStr;
                                return;
                            }

                            if (!colB) return;

                            if (colB === '𝗙𝗼𝗹𝗹𝗼𝘄𝗲𝗿𝘀') { currentCategory = 'social'; return; }
                            if (colB === 'YouTube (@tenoffcl):' || colB === 'YouTube (@tenoffcl)') { currentCategory = 'yt_base'; return; }
                            if (colB === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆') { currentCategory = 'spo_base'; return; }
                            if (colB === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆 𝗹𝗶𝘀𝘁𝗲𝗻𝗲𝗿𝘀 (𝗧𝗼𝗽 𝟱)') { currentCategory = 'spo_list'; return; }
                            if (colB === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆 𝘀𝘁𝗿𝗲𝗮𝗺𝘀 (𝗧𝗼𝗽 𝟭𝟬)') { currentCategory = 'spo_streams'; return; }
                            if (colB === 'Youtube views' || colB === '𝗬𝗼𝘂𝘁𝘂𝗯𝗲 𝗩𝗶𝗲𝘄𝘀') { currentCategory = 'yt_views'; return; }

                            if (!colC || colC === '') return;

                            const rowHtml = createRow(colB, colC, colD);

                            if (currentCategory === 'social') htmlSocial += rowHtml;
                            if (currentCategory === 'yt_base') htmlYtBase += rowHtml;
                            if (currentCategory === 'spo_base') htmlSpoBase += rowHtml;
                            if (currentCategory === 'spo_list') htmlSpoList += rowHtml;
                            if (currentCategory === 'spo_streams') htmlSpoStreams += rowHtml;
                            if (currentCategory === 'yt_views') htmlYtViews += rowHtml;
                        });

                        document.getElementById('box-social').innerHTML = htmlSocial;
                        document.getElementById('box-yt-base').innerHTML = htmlYtBase;
                        document.getElementById('box-spotify-base').innerHTML = htmlSpoBase; 
                        document.getElementById('box-spotify-list').innerHTML = htmlSpoList;
                        document.getElementById('box-spotify-streams').innerHTML = htmlSpoStreams;
                        document.getElementById('box-yt-views').innerHTML = htmlYtViews;
                        
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('capture-area').style.display = 'block';
                        document.getElementById('btn-save').style.display = 'block';
                    } catch (e) {
                        console.error(e);
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('error-msg').innerText = "พบปัญหา: " + e.message;
                        document.getElementById('error-msg').style.display = 'block';
                    }
                }
            });
        }

        function saveAsImage() {
            window.scrollTo(0, 0);
            const box = document.getElementById('capture-area');
            html2canvas(box, { 
                scale: 2, 
                backgroundColor: '#e5e7eb',
                useCORS: true,
                allowTaint: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'ten-statistic.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
