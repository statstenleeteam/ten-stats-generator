<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>TEN STATISTIC - Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f0f0f0;
            font-family: 'Montserrat', 'Noto Sans Thai', sans-serif;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }

        /* --- ระบบปุ่ม Tabs --- */
        .tab-container {
            display: flex; gap: 15px; margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #d1d5db; color: #374151; border: none; padding: 12px 24px;
            border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .tab-btn:hover { background-color: #9ca3af; }
        .tab-btn.active { background-color: #a855f7; color: white; box-shadow: 0 4px 10px rgba(168, 85, 247, 0.4); }

        .capture-wrapper {
            background-color: #f3effc; /* เปลี่ยนพื้นหลังเป็นสีม่วงอ่อนมาก ให้เข้ากับตารางใหม่ */
            padding: 40px;
            border-radius: 12px;
            display: none; 
            margin: 0 auto;
        }
        .capture-wrapper.active { display: block; }

        /* ดีไซน์หัวกระดาษ */
        .page-header { text-align: center; margin-bottom: 30px; position: relative; }
        .page-header h1 { margin: 0; font-size: 52px; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; color: #111827; }
        .page-header h1 span { color: #9333ea; font-style: italic; padding-right: 8px; }
        .page-header p { margin: 12px 0 0 0; font-size: 16px; color: #4b5563; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
        .page-header::after { content: ''; display: block; width: 100px; height: 4px; background: linear-gradient(90deg, #a855f7, #f97316); margin: 20px auto 0; border-radius: 2px; }

        /* --- ดีไซน์ใหม่: กล่อง Total ด้านบน --- */
        .total-box-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .total-box {
            background-color: #1f2029; /* สีดำเข้ม */
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 320px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        .total-box h3 { margin: 0; font-size: 14px; font-weight: 600; color: #d1d5db; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase;}
        .total-box .val { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: 1px;}
        .total-box .diff { margin-top: 8px; font-size: 14px; font-weight: 700; }

        /* --- ดีไซน์ใหม่: ตารางแบบ Canva --- */
        .canva-table-container {
            background-color: transparent;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .canva-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 14px;
        }
        .canva-table td { 
            padding: 8px 15px; 
            color: #4c3c6d; /* สีม่วงเข้มสำหรับชื่อเพลง */
            font-weight: 600;
        }
        
        /* สลับสีบรรทัด ขาว / ม่วงอ่อน */
        .canva-table tr.data-row:nth-child(even) { background-color: #ffffff; }
        .canva-table tr.data-row:nth-child(odd) { background-color: #ece5fa; }

        /* แถบสีดำชื่ออัลบั้ม */
        .canva-table tr.section-title {
            background-color: #1f2029;
            color: #ffffff;
        }
        .canva-table tr.section-title td {
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            padding: 10px 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .song-name { text-align: left; }
        .song-value { text-align: center; width: 120px; }
        .song-diff { text-align: right; width: 120px; }

        .up { color: #10b981; }
        .down { color: #ef4444; }
        .equal { color: #8b5cf6; } 

        /* --- ดีไซน์แท็บ Overall (คงเดิม) --- */
        .grid-container { display: grid; grid-template-columns: 310px 310px 360px 310px; gap: 20px; align-items: start; }
        .col-left, .col-right { display: flex; flex-direction: column; gap: 20px; }
        .stat-box-overall { background-color: #1c1c24; color: #ffffff; padding: 25px 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); box-sizing: border-box; margin-bottom: 20px;}
        .header { font-size: 15px; font-weight: 700; letter-spacing: 1px; padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase; line-height: 1.4; }
        .h-purple { color: #a855f7; border-bottom: 2px solid #a855f7; }
        .h-red { color: #ef4444; border-bottom: 2px solid #ef4444; }    
        .h-orange { color: #f97316; border-bottom: 2px solid #f97316; } 
        .row-overall { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; margin-bottom: 14px; font-size: 13.5px; align-items: center; }
        .platform-name { color: #d1d5db; line-height: 1.3; font-weight: 500; }
        .value-col { text-align: right; font-weight: 600; white-space: nowrap; color: #fff;}
        .diff-col { text-align: right; font-size: 12px; font-weight: 600; white-space: nowrap; min-width: 75px; }

        /* สไตล์ตาราง Charts (คงเดิม) */
        .charts-table { width: 100%; border-collapse: collapse; color: #fff; font-size: 14px; background-color: #1c1c24; border-radius: 12px;}
        .charts-table td { padding: 12px 15px; border-bottom: 1px solid #374151; }
        .charts-table tr.section-title td { color: #f97316; font-weight: 700; font-size: 15px; padding-top: 30px; border-bottom: 2px solid #f97316; background-color: transparent;}

        .btn-download { margin-top: 30px; background-color: #a855f7; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(168, 85, 247, 0.3); transition: 0.2s; }
        .btn-download:hover { background-color: #9333ea; transform: translateY(-2px); }
        #loading { font-weight: bold; margin-bottom: 20px; font-size: 18px; color: #333; }
        #error-msg { display: none; color: red; font-weight: bold; }
    </style>
</head>
<body>

    <div class="tab-container" id="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-overall')">📊 OVERALL</button>
        <button class="tab-btn" onclick="switchTab('tab-spo')">🎧 SPOTIFY</button>
        <button class="tab-btn" onclick="switchTab('tab-ytms')">🎵 YT MUSIC</button>
        <button class="tab-btn" onclick="switchTab('tab-charts')">🏆 CHARTS</button>
    </div>

    <!-- โชว์สถานะการโหลดข้อมูล -->
    <div id="loading">⏳ กำลังประมวลผลข้อมูล... กรุณารอสักครู่</div>
    <div id="error-msg"></div>

    <!-- แท็บ 1: OVERALL -->
    <div class="capture-wrapper active" id="tab-overall" style="width: 1350px;">
        <div class="page-header">
            <h1 id="main-title"><span>TEN</span>STATISTIC</h1>
            <p id="sub-title-overall">TEN LEE TEAM</p>
        </div>
        <div class="grid-container">
            <div class="col-left">
                <div class="stat-box-overall"><div class="header h-purple">SOCIAL FOLLOWERS</div><div id="box-social"></div></div>
                <div class="stat-box-overall"><div class="header h-red">YOUTUBE BASE</div><div id="box-yt-base"></div></div>
            </div>
            <div class="stat-box-overall"><div class="header h-red">YOUTUBE VIEWS</div><div id="box-yt-views"></div></div>
            <div class="stat-box-overall" style="width: 100%;"><div class="header h-orange">SPOTIFY STREAMS <br>(TOP 10)</div><div id="box-spotify-streams"></div></div>
            <div class="col-right">
                <div class="stat-box-overall"><div class="header h-orange">SPOTIFY LISTENERS <br>(TOP 5)</div><div id="box-spotify-list"></div></div>
                <div class="stat-box-overall"><div class="header h-orange">SPOTIFY BASE</div><div id="box-spotify-base"></div></div>
            </div>
        </div>
    </div>

    <!-- แท็บ 2: SPOTIFY (แบบ Canva) -->
    <div class="capture-wrapper" id="tab-spo" style="width: 800px;">
        <div class="page-header" style="margin-bottom: 20px;">
            <!-- หัวข้อแบบ outline สีม่วง -->
            <h1 style="color: transparent; -webkit-text-stroke: 1.5px #8b5cf6;">SPOTIFY STREAMS</h1>
            <p id="sub-title-spo">TEN LEE TEAM</p>
        </div>
        
        <!-- กล่อง Total ยอดรวม -->
        <div class="total-box-container" id="spo-totals">
            <!-- ข้อมูลจะถูกแทรกที่นี่ -->
        </div>

        <div class="canva-table-container">
            <table class="canva-table" id="table-spo"></table>
        </div>
    </div>

    <!-- แท็บ 3: YT MUSIC (แบบ Canva) -->
    <div class="capture-wrapper" id="tab-ytms" style="width: 800px;">
        <div class="page-header" style="margin-bottom: 20px;">
            <!-- หัวข้อแบบ outline สีแดง -->
            <h1 style="text-transform: none; color: transparent; -webkit-text-stroke: 1.5px #ef4444;">YouTube MUSIC STREAMS</h1>
            <p style="text-transform: none; letter-spacing: 2px; font-size: 18px;">TEN LEE TEAM • <span id="date-ytms"></span></p>
        </div>
        
        <!-- กล่อง Total ยอดรวม -->
        <div class="total-box-container" id="ytms-totals">
             <!-- ข้อมูลจะถูกแทรกที่นี่ -->
        </div>

        <div class="canva-table-container">
            <table class="canva-table" id="table-ytms"></table>
        </div>
    </div>

    <!-- แท็บ 4: CHARTS (คงดีไซน์พื้นดำให้ดูแพง) -->
    <div class="capture-wrapper" id="tab-charts" style="width: 1000px; background-color: #e5e7eb;">
        <div class="page-header" style="margin-bottom: 20px;">
            <h1 style="text-transform: none;"><span style="font-style: normal; color: #9333ea;">TEN'S</span> Music Charts</h1>
            <p style="text-transform: none; letter-spacing: 2px; font-size: 18px;">: <span id="date-charts"></span></p>
        </div>
        <div class="stat-box-overall" style="width: 100%; padding: 0;">
            <table class="charts-table" id="table-charts"></table>
        </div>
    </div>

    <button class="btn-download" onclick="saveAsImage()" style="display: none;" id="btn-save">📸 ดาวน์โหลดรูปภาพ</button>

    <script>
        // === ลิงก์ CSV จาก Google Sheets ===
        const CSV_OVERALL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS13SniBy8Q6Z-FJlhMVqqQZrTdsC2u_IKaR_4P8kCyJHaDk56_5dsG6jGR3yUOesFAn-L1j8ab2zP/pub?gid=60150505&single=true&output=csv';
        const CSV_SPO = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS13SniBy8Q6Z-FJlhMVqqQZrTdsC2u_IKaR_4P8kCyJHaDk56_5dsG6jGR3yUOesFAn-L1j8ab2zP/pub?gid=907365518&single=true&output=csv'; 
        const CSV_YTMS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS13SniBy8Q6Z-FJlhMVqqQZrTdsC2u_IKaR_4P8kCyJHaDk56_5dsG6jGR3yUOesFAn-L1j8ab2zP/pub?gid=1171176371&single=true&output=csv'; 
        const CSV_CHARTS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS13SniBy8Q6Z-FJlhMVqqQZrTdsC2u_IKaR_4P8kCyJHaDk56_5dsG6jGR3yUOesFAn-L1j8ab2zP/pub?gid=1645940158&single=true&output=csv'; 

        let currentActiveTab = 'tab-overall';

        function switchTab(tabId) {
            document.querySelectorAll('.capture-wrapper').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            currentActiveTab = tabId;
        }

        function formatDiff(diffValue) {
            if (!diffValue) return '';
            let strValue = String(diffValue).trim();
            strValue = strValue.replace(/▲\s*▲/g, '▲');
            strValue = strValue.replace(/▼\s*▼/g, '▼');
            strValue = strValue.replace(/([+-]\s?)(\d{4,})/g, function(match, p1, p2) {
                return p1 + parseInt(p2).toLocaleString();
            });
            if (strValue.includes('=')) return `<span class="equal">${strValue}</span>`;
            if (strValue.includes('▲')) return `<span class="up">${strValue}</span>`;
            if (strValue.includes('▼')) return `<span class="down">${strValue}</span>`;
            return `<span>${strValue}</span>`;
        }

        function formatNumber(numStr) {
            if(!numStr) return '';
            const num = parseFloat(numStr.replace(/,/g, ''));
            if (isNaN(num)) return numStr;
            if (numStr.includes('M') || numStr.includes('K')) return numStr;
            return num.toLocaleString();
        }

        async function fetchCSV(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) return null;
                const text = await response.text();
                return Papa.parse(text).data;
            } catch (err) {
                console.error("Fetch error: ", err);
                return null;
            }
        }

        function processOverall(data) {
            let htmlSocial = '', htmlYtBase = '', htmlYtViews = '';
            let htmlSpoStreams = '', htmlSpoList = '', htmlSpoBase = '';
            let currentCategory = '';

            data.forEach(row => {
                if (!row) return;
                const colB = row[1] ? String(row[1]).trim() : ''; 
                const colC = row[2] ? String(row[2]).trim() : ''; 
                const colD = row[3] ? String(row[3]).trim() : ''; 

                if (colB.includes('TEN STATISTIC')) {
                    document.getElementById('sub-title-overall').innerText = "TEN LEE TEAM • " + colB.replace('TEN STATISTIC :', '').trim();
                    return;
                }
                if (!colB) return;
                
                if (colB === '𝗙𝗼𝗹𝗹𝗼𝘄𝗲𝗿𝘀') { currentCategory = 'social'; return; }
                if (colB === 'YouTube (@tenoffcl):' || colB === 'YouTube (@tenoffcl)') { currentCategory = 'yt_base'; return; }
                if (colB === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆') { currentCategory = 'spo_base'; return; }
                if (colB === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆 𝗹𝗶𝘀𝘁𝗲𝗻𝗲𝗿𝘀 (𝗧𝗼𝗽 𝟱)') { currentCategory = 'spo_list'; return; }
                if (colB === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆 𝘀𝘁𝗿𝗲𝗮𝗺𝘀 (𝗧𝗼𝗽 𝟭𝟬)') { currentCategory = 'spo_streams'; return; }
                if (colB === 'Youtube views' || colB === '𝗬𝗼𝘂𝘁𝘂𝗯𝗲 𝗩𝗶𝗲𝘄𝘀') { currentCategory = 'yt_views'; return; }
                if (!colC) return;

                let cleanDiff = formatDiff(colD);
                if(cleanDiff.includes('for 7 days')) cleanDiff = cleanDiff.replace('for 7 days', '<br>for 7 days');
                
                const rowHtml = `<div class="row-overall"><span class="platform-name">${colB}</span><span class="value-col">${formatNumber(colC)}</span><span class="diff-col">${cleanDiff}</span></div>`;

                if (currentCategory === 'social') htmlSocial += rowHtml;
                if (currentCategory === 'yt_base') htmlYtBase += rowHtml;
                if (currentCategory === 'spo_base') htmlSpoBase += rowHtml;
                if (currentCategory === 'spo_list') htmlSpoList += rowHtml;
                if (currentCategory === 'spo_streams') htmlSpoStreams += rowHtml;
                if (currentCategory === 'yt_views') htmlYtViews += rowHtml;
            });

            document.getElementById('box-social').innerHTML = htmlSocial;
            document.getElementById('box-yt-base').innerHTML = htmlYtBase;
            document.getElementById('box-spotify-base').innerHTML = htmlSpoBase; 
            document.getElementById('box-spotify-list').innerHTML = htmlSpoList;
            document.getElementById('box-spotify-streams').innerHTML = htmlSpoStreams;
            document.getElementById('box-yt-views').innerHTML = htmlYtViews;
        }

        // ฟังก์ชันสร้างตารางสไตล์ Canva (Spo & Ytms)
        function processCanvaTable(data, tableId, titleId, totalsId, datePrefix) {
            let html = '';
            let totalAllHtml = '';
            let totalSoloHtml = '';

            data.forEach(row => {
                if (!row) return;
                let rawColA = row[0] ? String(row[0]).trim() : '';
                let colName = row[1] ? String(row[1]).trim() : '';
                let colVal = row[2] ? String(row[2]).trim() : '';
                let colDiff = row[3] ? String(row[3]).trim() : '';
                
                let rawTitle = rawColA + ' ' + colName; 

                // เช็กวันที่หัวกระดาษ
                if (rawTitle.includes(datePrefix)) {
                    let dateParts = rawTitle.split(':');
                    let dateVal = dateParts.length > 1 ? dateParts[1].trim() : rawTitle.replace(datePrefix, '').trim();
                    
                    if (titleId === 'date-ytms') {
                        document.getElementById(titleId).innerText = dateVal;
                    } else {
                        document.getElementById(titleId).innerText = "TEN LEE TEAM • " + dateVal;
                    }
                    return;
                }

                // ข้ามบรรทัดที่ไม่จำเป็น
                if (colName === 'streams' || colVal === 'streams' || (!colName && !colVal)) return;
                // ข้ามหัวข้อ Total Album เพราะเราเอาแต่รายบั้มไปเป็นแถบดำแล้ว
                if (colName === 'Total Album:') return;

                // ดักจับกล่อง Total (ALL) และ Total (SOLO) ไปไว้ด้านบน
                if (colName.toUpperCase().includes('TOTAL (ALL)')) {
                    totalAllHtml = `
                        <div class="total-box">
                            <h3>TOTAL STREAMS (ALL)</h3>
                            <div class="val">${formatNumber(colVal)}</div>
                            <div class="diff">${formatDiff(colDiff)}</div>
                        </div>`;
                    return;
                }
                if (colName.toUpperCase().includes('TOTAL (SOLO)')) {
                    totalSoloHtml = `
                        <div class="total-box">
                            <h3>TOTAL STREAMS (SOLO)</h3>
                            <div class="val">${formatNumber(colVal)}</div>
                            <div class="diff">${formatDiff(colDiff)}</div>
                        </div>`;
                    return;
                }

                // ถ้าเป็นหัวข้ออัลบั้ม (สร้างแถบสีดำ) เช่น TEN - Single, STUNNER, Album TEN:
                if ((colName && !colVal && !colDiff) || colName.toUpperCase().includes('ALBUM ')) {
                    // ทำความสะอาดชื่อนิดหน่อย เผื่อมีคำว่า Album นำหน้า
                    let cleanAlbumName = colName.replace('Album ', '').replace(':', '').trim();
                    if(rawColA) cleanAlbumName = rawColA + ' ' + cleanAlbumName; // เผื่อมีไอคอน

                    html += `<tr class="section-title">
                        <td class="song-name">${cleanAlbumName}</td>
                        <td class="song-value" style="color: #ef4444; font-size: 11px;">STREAMS</td>
                        <td class="song-diff" style="font-size: 11px;"><span class="up">▲</span><span class="down">▼</span></td>
                    </tr>`;
                } 
                // รายชื่อเพลงปกติ (สลับสีขาว/ม่วงอ่อน ด้วย CSS nth-child)
                else if (colName && colVal) {
                    html += `<tr class="data-row">
                        <td class="song-name">${colName}</td>
                        <td class="song-value">${formatNumber(colVal)}</td>
                        <td class="song-diff">${formatDiff(colDiff)}</td>
                    </tr>`;
                }
            });

            // แทรกกล่อง Total 
            if(totalAllHtml || totalSoloHtml) {
                document.getElementById(totalsId).innerHTML = totalAllHtml + totalSoloHtml;
            } else {
                document.getElementById(totalsId).style.display = 'none'; // ซ่อนถ้าไม่มีข้อมูล
            }

            document.getElementById(tableId).innerHTML = html;
        }

        function processChartsTable(data) {
            let html = '';
            data.forEach(row => {
                if (!row) return;
                const colA = row[1] ? String(row[1]).trim() : '';
                const colB = row[2] ? String(row[2]).trim() : '';
                const colC = row[3] ? String(row[3]).trim() : '';
                const colD = row[4] ? String(row[4]).trim() : '';
                const colE = row[5] ? String(row[5]).trim() : '';

                const rawTitle = (row[0] || '') + ' ' + colA + ' ' + colB;

                if (rawTitle.includes("Charts :") || rawTitle.includes("TEN'S Music Charts")) {
                    let dateParts = rawTitle.split(':');
                    let dateVal = dateParts.length > 1 ? dateParts[1].trim() : rawTitle.replace("TEN'S Music Charts", '').replace(":", "").trim();
                    document.getElementById('date-charts').innerText = dateVal;
                    return;
                }

                if (!colA && !colB) return;
                if (colB === 'Country' || colC === 'Name') return;

                if (colA && !colB && !colC && !colD) {
                    html += `<tr class="section-title"><td colspan="5">${colA}</td></tr>`;
                } else if (colA || colB) {
                    html += `<tr>
                        <td style="width: 25%; color: #d1d5db; padding-left: 15px;">${colA}</td>
                        <td style="width: 15%; color: #9ca3af;">${colB}</td>
                        <td style="width: 30%; font-weight: 600; text-align: center;">${colC}</td>
                        <td style="width: 15%; text-align: right; font-weight: 600; font-size: 16px;">${colD}</td>
                        <td style="width: 15%; text-align: right;">${formatDiff(colE)}</td>
                    </tr>`;
                }
            });
            document.getElementById('table-charts').innerHTML = html;
        }

        // โหลดข้อมูลทุกชีท
        async function loadAllData() {
            try {
                const [dataOverall, dataSpo, dataYtms, dataCharts] = await Promise.all([
                    fetchCSV(CSV_OVERALL),
                    fetchCSV(CSV_SPO),
                    fetchCSV(CSV_YTMS),
                    fetchCSV(CSV_CHARTS)
                ]);

                if (dataOverall) processOverall(dataOverall);
                // เรียกใช้ฟังก์ชัน processCanvaTable แทน
                if (dataSpo) processCanvaTable(dataSpo, 'table-spo', 'sub-title-spo', 'spo-totals', 'Spotify Streams');
                if (dataYtms) processCanvaTable(dataYtms, 'table-ytms', 'date-ytms', 'ytms-totals', 'YouTube Music Streams');
                if (dataCharts) processChartsTable(dataCharts);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('btn-save').style.display = 'block';
            } catch (error) {
                console.error("Load all data error: ", error);
                document.getElementById('loading').innerText = '❌ เกิดข้อผิดพลาดในการโหลดข้อมูล (กรุณารีเฟรชหน้าเว็บใหม่)';
            }
        }

        window.onload = loadAllData;

        function saveAsImage() {
            window.scrollTo(0, 0);
            const box = document.getElementById(currentActiveTab);
            const btn = document.getElementById('btn-save');
            const oldText = btn.innerText;
            btn.innerText = '⏳ กำลังประมวลผล...';

            html2canvas(box, { 
                scale: 2, backgroundColor: '#f3effc', useCORS: true // ใช้สีพื้นหลังที่ถูกต้องตอนแคป
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = currentActiveTab + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerText = oldText;
            });
        }
    </script>
</body>
</html>
