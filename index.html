<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>TEN STATS - Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background-color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .card-container { display: flex; gap: 20px; background-color: #e5e7eb; padding: 20px; }
        .stat-box { background-color: #1e1e24; color: #ffffff; width: 350px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .header-pink { color: #a855f7; border-bottom: 3px solid #a855f7; }
        .header-orange { color: #f97316; border-bottom: 3px solid #f97316; }
        .header { font-size: 18px; font-weight: bold; letter-spacing: 1px; padding-bottom: 8px; margin-bottom: 20px; text-transform: uppercase; }
        .row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
        .platform-name { color: #d1d5db; }
        .up { color: #10b981; font-weight: bold; font-size: 12px; }
        .down { color: #ef4444; font-weight: bold; font-size: 12px; }
        .btn-download { margin-top: 30px; background-color: #a855f7; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-download:hover { background-color: #9333ea; }
        #loading { color: #333; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loading">กำลังดึงข้อมูลจาก Google Sheets...</div>
    <div id="capture-area" class="card-container" style="display: none;">
        <div class="stat-box">
            <div class="header header-pink">SOCIAL FOLLOWERS</div>
            <div id="followers-container"></div>
        </div>
        <div class="stat-box">
            <div class="header header-orange">SPOTIFY STREAMS (TOP 10)</div>
            <div id="spotify-container"></div>
        </div>
    </div>
    <button class="btn-download" onclick="saveAsImage()" style="display: none;" id="btn-save">📸 ดาวน์โหลดรูปภาพ</button>

    <script>
        function formatDiff(diffValue) {
            if (!diffValue) return '';
            const strValue = String(diffValue).trim();
            if (strValue.includes('▲')) return `<span class="up">${strValue}</span>`;
            if (strValue.includes('▼')) return `<span class="down">${strValue}</span>`;
            
            const num = parseInt(strValue.replace(/,/g, ''));
            if (!isNaN(num) && num !== 0) {
                if (num > 0) return `<span class="up">▲ (+${num.toLocaleString()})</span>`;
                if (num < 0) return `<span class="down">▼ (${num.toLocaleString()})</span>`;
            }
            return `<span>${strValue}</span>`;
        }

        function loadData() {
            // *** นำลิงก์ CSV ของหน้า Main มาวางในเครื่องหมาย ' ' ด้านล่างนี้ ***
            const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS13SniBy8Q6Z-FJlhMVqqQZrTdsC2u_IKaR_4P8kCyJHaDk56_5dsG6jGR3yUOesFAn-L1j8ab2zP/pub?gid=1826113344&single=true&output=csv';

            Papa.parse(sheetUrl, {
                download: true,
                header: false,
                complete: function(results) {
                    const data = results.data;
                    let htmlFollowers = '';
                    let htmlSpotify = '';
                    let currentSection = 'other';
                    let spotifyCount = 0; // ตัวนับจำนวนเพลง

                    data.forEach((row, index) => {
                        if (index === 0) return;

                        const colA = row[0] ? String(row[0]).trim() : ''; 
                        const colB = row[1] ? String(row[1]).trim() : ''; 
                        const colC = row[2] ? String(row[2]).trim() : ''; 

                        if (!colA) return;

                        // ล็อกเป้าหมายการอ่านหมวดหมู่จากชื่อแบบเป๊ะๆ
                        if (colA === '𝗙𝗼𝗹𝗹𝗼𝘄𝗲𝗿𝘀') {
                            currentSection = 'followers';
                            return;
                        } else if (colA === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆 𝘀𝘁𝗿𝗲𝗮𝗺𝘀 (𝗧𝗼𝗽 𝟭𝟬)') {
                            currentSection = 'spotify_streams';
                            spotifyCount = 0; // เริ่มนับเพลงใหม่
                            return;
                        } else if (colA === 'YouTube (@tenoffcl):' || colA === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆' || colA === '𝗦𝗽𝗼𝘁𝗶𝗳𝘆 𝗹𝗶𝘀𝘁𝗲𝗻𝗲𝗿𝘀 (𝗧𝗼𝗽 𝟱)' || colA === '𝗬𝗼𝘂𝘁𝘂𝗯𝗲 𝗩𝗶𝗲𝘄𝘀') {
                            // ถ้าเจอหัวข้ออื่น ให้หยุดอ่านข้อมูล
                            currentSection = 'other';
                            return;
                        }

                        // ถ้ายอดรวมว่างเปล่า ให้ข้ามไป
                        if (!colB || colB === '' || colB === 'NaN') return;

                        // จำกัด Spotify ให้ดึงมาแค่ 10 เพลง
                        if (currentSection === 'spotify_streams') {
                            if (spotifyCount >= 10) return;
                            spotifyCount++;
                        }

                        if (currentSection === 'followers' || currentSection === 'spotify_streams') {
                            const title = colA;
                            let total = colB;
                            const parsedB = parseInt(colB.replace(/,/g, ''));
                            if (!isNaN(parsedB)) total = parsedB.toLocaleString();
                            const diff = formatDiff(colC);

                            const rowHtml = `
                                <div class="row">
                                    <span class="platform-name">${title}</span>
                                    <span>${total} ${diff}</span>
                                </div>
                            `;

                            if (currentSection === 'followers') htmlFollowers += rowHtml;
                            if (currentSection === 'spotify_streams') htmlSpotify += rowHtml;
                        }
                    });

                    document.getElementById('followers-container').innerHTML = htmlFollowers;
                    document.getElementById('spotify-container').innerHTML = htmlSpotify;
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('capture-area').style.display = 'flex';
                    document.getElementById('btn-save').style.display = 'block';
                }
            });
        }

        function saveAsImage() {
            const box = document.getElementById('capture-area');
            html2canvas(box, { scale: 3, backgroundColor: '#e5e7eb' }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'ten-stat-update.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
